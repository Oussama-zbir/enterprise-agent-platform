<svg xmlns="http://www.w3.org/2000/svg" width="845" height="773"
     viewBox="0 0 845 773" role="img"
     aria-label="Terminal transcript of python -m enterprise_agent_platform.demo: an agent run pauses on a critical pay_invoice tool call, the requester is refused, a second person approves, and the run resumes from its checkpoint.">
  <rect width="845" height="773" rx="10" fill="#0f172a"/>
  <rect width="845" height="34" rx="10" fill="#1e293b"/>
  <rect y="24" width="845" height="10" fill="#1e293b"/>
  <circle cx="21" cy="17" r="5" fill="#f87171"/>
  <circle cx="39" cy="17" r="5" fill="#fbbf24"/>
  <circle cx="57" cy="17" r="5" fill="#4ade80"/>
  <text x="422" y="21" fill="#94a3b8" font-size="11.5" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    enterprise-agent-platform — offline demo, no API key, no network
  </text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="12.5" xml:space="preserve">
    <text x="22" y="52" fill="#7dd3fc">$ python -m enterprise_agent_platform.demo</text>
    <text x="22" y="90" fill="#a5b4fc"># 0. The two credentials this deployment issues.</text>
    <text x="22" y="109" fill="#94a3b8">$ export EAP_ANALYST_TOKEN=demo-analyst-token-please-change-me   # analyst-1: tasks:read, tasks:write</text>
    <text x="22" y="128" fill="#94a3b8">$ export EAP_MANAGER_TOKEN=demo-manager-token-please-change-me   # finance-manager-2: tasks:approve, tasks:read</text>
    <text x="22" y="166" fill="#a5b4fc"># 2. Run it. The agent reads the invoice unattended, then asks to pay it — &#x27;pay_invoice&#x27; is</text>
    <text x="22" y="185" fill="#a5b4fc">#    CRITICAL, above EAP_AGENT_AUTO_APPROVE_UP_TO=read, so the whole turn stops.</text>
    <text x="22" y="204" fill="#7dd3fc">$ curl -s -X POST $API/tasks/&lt;id&gt;/run -H &quot;Authorization: Bearer $EAP_ANALYST_TOKEN&quot;</text>
    <text x="22" y="223" fill="#cbd5e1">{ &quot;task&quot;: { &quot;status&quot;: &quot;awaiting_approval&quot;, &quot;version&quot;: 3, … },</text>
    <text x="22" y="242" fill="#cbd5e1">  &quot;detail&quot;: &quot;approval required for: pay_invoice&quot;,</text>
    <text x="22" y="261" fill="#cbd5e1">  &quot;steps&quot;: 2, &quot;tool_calls&quot;: 1, &quot;pending_tool_calls&quot;: [&quot;pay_invoice&quot;] }</text>
    <text x="22" y="299" fill="#a5b4fc"># 3. Show the approver the decision: which calls are held, with the arguments they</text>
    <text x="22" y="318" fill="#a5b4fc">#    would run with and the risk that stopped them.</text>
    <text x="22" y="337" fill="#7dd3fc">$ curl -s $API/tasks/&lt;id&gt;/approval -H &quot;Authorization: Bearer $EAP_MANAGER_TOKEN&quot;</text>
    <text x="22" y="356" fill="#cbd5e1">{ &quot;status&quot;: &quot;awaiting_approval&quot;, &quot;detail&quot;: &quot;approval required for: pay_invoice&quot;,</text>
    <text x="22" y="375" fill="#cbd5e1">  &quot;pending_tool_calls&quot;: [ { &quot;id&quot;: &quot;demo_2_0&quot;, &quot;name&quot;: &quot;pay_invoice&quot;,</text>
    <text x="22" y="394" fill="#cbd5e1">      &quot;arguments&quot;: { &quot;invoice_id&quot;: &quot;INV-1043&quot;, &quot;amount_eur&quot;: &quot;1284.50&quot; },</text>
    <text x="22" y="413" fill="#cbd5e1">      &quot;risk&quot;: &quot;critical&quot;, &quot;needs_approval&quot;: true } ] }</text>
    <text x="22" y="451" fill="#a5b4fc"># 4. The analyst tries to release the task they asked for. 403: the authority to make</text>
    <text x="22" y="470" fill="#a5b4fc">#    an agent act is not the authority to release what it wants to do.</text>
    <text x="22" y="489" fill="#7dd3fc">$ curl -s -X POST $API/tasks/&lt;id&gt;/approve -H &quot;Authorization: Bearer $EAP_ANALYST_TOKEN&quot;</text>
    <text x="22" y="508" fill="#fca5a5" font-weight="600">{ &quot;detail&quot;: &quot;This token holds none of: tasks:approve.&quot; }</text>
    <text x="22" y="546" fill="#a5b4fc"># 5. The manager approves. The held call runs and the *same* run continues from its</text>
    <text x="22" y="565" fill="#a5b4fc">#    checkpoint: the counters below cover the whole run, pause included.</text>
    <text x="22" y="584" fill="#7dd3fc">$ curl -s -X POST $API/tasks/&lt;id&gt;/approve -H &quot;Authorization: Bearer $EAP_MANAGER_TOKEN&quot; \</text>
    <text x="22" y="603" fill="#7dd3fc">    -d &#x27;{&quot;note&quot;: &quot;supplier and amount verified&quot;}&#x27;</text>
    <text x="22" y="622" fill="#cbd5e1">{ &quot;task&quot;: { &quot;status&quot;: &quot;completed&quot;, &quot;version&quot;: 5, &quot;history&quot;: [ …</text>
    <text x="22" y="641" fill="#cbd5e1">      { &quot;to_status&quot;: &quot;running&quot;,</text>
    <text x="22" y="660" fill="#86efac" font-weight="600">        &quot;reason&quot;: &quot;approved by finance-manager-2: supplier and amount verified&quot; }, … ] },</text>
    <text x="22" y="679" fill="#cbd5e1">  &quot;steps&quot;: 3, &quot;tool_calls&quot;: 2, &quot;input_tokens&quot;: 909, &quot;output_tokens&quot;: 109 }</text>
    <text x="22" y="717" fill="#4ade80" font-weight="600"># Done. Task &lt;id&gt; is &#x27;completed&#x27; after 3 model calls and 2 tool calls, pausing on</text>
    <text x="22" y="736" fill="#4ade80" font-weight="600"># pay_invoice for a human. The ledger records one payment: 1284.50 EUR under PAY-1043.</text>
  </g>
</svg>
