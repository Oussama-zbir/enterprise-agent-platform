name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -v

  # The repository contract tests run against a real server here: the version
  # check they exercise is a database behaviour (`UPDATE ... WHERE version = $n`
  # under a row lock), and nothing about it can be verified with a stub.
  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eap
          POSTGRES_PASSWORD: eap
          POSTGRES_DB: eap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Test (repository contract against PostgreSQL)
        env:
          EAP_TEST_DATABASE_URL: postgresql://eap:eap@localhost:5432/eap_test
        run: pytest -v tests/test_task_repository.py
