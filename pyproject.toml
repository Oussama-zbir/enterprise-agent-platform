[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-agent-platform"
version = "0.1.0"
description = "Production-oriented enterprise agent platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Oussama Zbir", email = "oussamazbirpro@gmail.com" }]
keywords = ["agentic-ai", "fastapi", "mcp", "llm", "production-ai"]
dependencies = [
    "anthropic>=1.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
# The demo walkthrough drives the app over an in-process ASGI transport.
demo = ["httpx>=0.27"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "asyncpg>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_agent_platform"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

# asyncpg ships no type information. The untyped surface is confined to
# `tasks/postgres.py`, whose own public API is fully typed.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
